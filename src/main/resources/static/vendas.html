<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caixa | MercControl</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><strong>🛒 MercControl</strong><nav><a href="produtos.html">Produtos</a><a href="clientes.html">Clientes</a><a href="vendas.html" class="ativo">Caixa</a><a href="estoque.html">Estoque</a><a href="relatorio.html">Relatório</a></nav></header>
<main><section class="painel"><h2>Caixa do Mercadinho</h2><div class="corpo"><div class="grade"><div class="campo"><label for="vCliente">Cliente (opcional):</label><select id="vCliente"></select></div><div class="campo"><label for="vProduto">Produto:</label><select id="vProduto"></select></div><div class="campo"><label for="vQtd">Quantidade:</label><input id="vQtd" type="number" min="1" step="1" value="1"></div></div><div class="acoes"><button id="vAdicionar" type="button" class="principal">Adicionar ao carrinho</button><button id="vLimpar" type="button">Cancelar venda</button></div></div></section>
<section class="painel"><h2>Itens da compra</h2><div class="tabela"><table><thead><tr><th>Produto</th><th>Preço unitário</th><th>Qtd.</th><th>Subtotal</th><th>Ação</th></tr></thead><tbody id="tabCarrinho"></tbody></table></div><div class="caixa-total"><span>Total da compra</span><strong id="totalCarrinho">R$ 0,00</strong></div><div class="corpo"><div class="grade"><div class="campo"><label for="vPagamento">Forma de pagamento:</label><select id="vPagamento"><option value="Dinheiro">Dinheiro</option><option value="Pix">Pix</option><option value="Cartão">Cartão</option></select></div><div class="campo"><label for="vRecebido">Valor recebido (dinheiro):</label><input id="vRecebido" type="number" min="0" step="0.01" placeholder="0,00"></div><div class="campo"><label>Troco:</label><output id="vTroco">R$ 0,00</output></div></div><div class="acoes"><button id="vFinalizar" type="button" class="principal">Finalizar compra</button></div></div></section><p id="aviso" role="status"></p></main>
<footer>MercControl • Etapa 9 • Caixa demonstrativo, sem cobrança real</footer><script src="js/app.js"></script></body></html>
